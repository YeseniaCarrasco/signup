{% extends "base.html" %}
{% block content %}
  <h1>Office Hours Sign-Up</h1>
  {% if g.user %}
    <p>You are logged in as <strong>{{ g.user['username'] }}</strong>.</p>
  {% else %}
    <p>No one is logged in.</p>
    <p><a href="{{ url_for('login') }}">Log in</a> or <a href="{{ url_for('register') }}">create an account</a>.</p>
  {% endif %}
{% endblock %}
