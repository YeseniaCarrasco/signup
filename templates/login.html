{% extends "base.html" %}
{% block title %}Log in · Office Hours Sign-Up{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" required autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
  <p>Need an account? <a href="{{ url_for('register') }}">Register</a>.</p>
{% endblock %}
